# Minimal keyless composition: real app, bash, and search tool; replayed model.
- id: llm-deepseek
  name: '@agentrans/llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@agentrans/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@agentrans/subprocess-local'

- id: agent-default-model
  name: '@agentrans/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@agentrans/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@agentrans/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@agentrans/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@agentrans/tool-jobs'
  disabled: true

- id: goal
  name: '@agentrans/goal'
  disabled: true

- id: goal-round-driver
  name: '@agentrans/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@agentrans/command-goal'
  disabled: true

- id: tool-goal
  name: '@agentrans/tool-goal'
  disabled: true

- id: skill
  name: '@agentrans/skill'
  disabled: true

- id: skill-filesystem
  name: '@agentrans/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@agentrans/tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@agentrans/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@agentrans/spill-local'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.DSH_SNAPSHOT_SPILL_LOCATOR_ROOT
