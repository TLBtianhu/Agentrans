# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@agentrans/llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: sandbox-policy
  name: '@agentrans/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@agentrans/subprocess-local'

- insert:
    - id: terminal
      name: '@agentrans/terminal'

- insert:
    - id: terminal-pwsh
      name: '@agentrans/terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@agentrans/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@agentrans/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.AGENTRANS_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@agentrans/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@agentrans/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@agentrans/tool-jobs'
  disabled: true

- id: goal
  name: '@agentrans/goal'
  disabled: true

- id: goal-round-driver
  name: '@agentrans/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@agentrans/command-goal'
  disabled: true

- id: tool-goal
  name: '@agentrans/tool-goal'
  disabled: true

- id: skill
  name: '@agentrans/skill'
  disabled: true

- id: skill-filesystem
  name: '@agentrans/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@agentrans/tool-skill'
  disabled: true

- id: tool-bash
  name: '@agentrans/tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@agentrans/tool-pwsh-persistent'
