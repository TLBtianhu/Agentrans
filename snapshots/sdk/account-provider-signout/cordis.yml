# TypeScript SDK snapshot-record patch over `agentrans --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@agentrans/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek-account
  name: '@agentrans/llm-deepseek-account'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@agentrans/session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.AGENTRANS_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@agentrans/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: account-signout-fixture
      name: './account-signout.mjs'
