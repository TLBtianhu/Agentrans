- name: '@agentrans/llm'
- name: '@agentrans/session'
- name: '@agentrans/session-projection'
- name: '@agentrans/system-prompt'
- name: '@agentrans/tools'
- name: '@agentrans/tool-executor-native'
- name: '@agentrans/agent'
- name: '@agentrans/agent-loop'
  config:
    agents: []
- name: '@agentrans/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@agentrans/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@agentrans/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
