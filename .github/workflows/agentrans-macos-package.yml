name: Package Agentrans · macOS · hosted

# Hosted-runner packaging for the unsigned Agentrans macOS build.
#
# The self-hosted lanes exist for signed and notarized release builds, which need
# an Apple Developer ID and credentials this repository does not have. This lane
# builds the same application without either, so the packaging, publishing, and
# update chain can be exercised for macOS too. Gatekeeper warns on first open
# until a Developer ID exists.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本，例如 0.2.2-alpha.3（须为合法 semver；latest 通道要求稳定版本）'
        type: string
        required: true
      channel:
        description: '更新通道：nightly 读取预发布，latest 读取正式版本'
        type: choice
        options: [nightly, latest]
        default: nightly
        required: true

permissions:
  contents: read

concurrency:
  group: agentrans-macos-unsigned-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      DSH_DESKTOP_UPDATE_CHANNEL: ${{ inputs.channel }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Packaging reads its settings from a git-ignored file, so the lane writes
      # only the settings it needs rather than copying the template.
      - name: Write the packaging settings this lane uses
        run: |
          printf 'DSH_DESKTOP_APP_ID=com.agentrans.app\n' > apps/desktop/.env.macos

      # The installer entry packages a prepared tree; this prepares it without
      # producing an artifact of its own.
      - name: Prepare the packaged runtime
        run: pnpm run package:desktop:mac:arm64 --unsigned --prepare-only --build-version ${{ inputs.version }}

      - name: Build the unsigned application
        run: node apps/desktop/scripts/package-agentrans-installer.mjs apps/desktop/artifacts/agentrans-installer mac-arm64

      - name: Publish the packaged files for this run
        uses: actions/upload-artifact@v4
        with:
          name: agentrans-macos-arm64
          path: |
            apps/desktop/artifacts/agentrans-installer/*
            !apps/desktop/artifacts/agentrans-installer/builder-debug.yml
          if-no-files-found: error
          compression-level: 0
