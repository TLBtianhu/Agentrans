# Inactive in this repository: this workflow triggers only on `master`, while the default branch is
# `main`. It is kept as the upstream design record. Activate it by retargeting the trigger together
# with the matching assertions in `scripts/ci-workflow.spec.ts`, not by editing one side alone.
# It also depends on the upstream `deepseek-harness/deepseek-harness-check` action and repository
# variables this fork does not configure, so retargeting alone would still not run a working check.

name: Policy
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr-check-on-base-branch-${{ github.ref_name }}
jobs:
  recheck:
    name: Recheck
    # Re-runs the head-branch checks, so it follows their variables.
    if: ${{ vars.MERGE_POLICY_MASTER_DIFF != '' && vars.MERGE_POLICY_MASTER_DIFF != 'off' || vars.MERGE_POLICY_PRE_MERGE != '' && vars.MERGE_POLICY_PRE_MERGE != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: deepseek-harness/deepseek-harness-check@master
        with:
          check: recheck
          base-branch: ${{ github.ref_name }}
          recheck-label-token: ${{ secrets.AGENTRANS_RECHECK_LABEL_TOKEN }}
