name: Verify the retained macOS 0.1.0-test.20261119.1 clean installation
run-name: Verify clean macOS ${{ inputs.arch }} 0.1.0-test.20261119.1 installation and session reopen

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Native macOS runner architecture
        type: choice
        options: [arm64, x64]
        required: true
      build_run:
        description: Successful packaging run ID for this architecture
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.repository == 'TLBtianhu/Agentrans' && github.ref == 'refs/heads/codex/macos-5-clean-qa-20261119'
    name: Verify macOS ${{ inputs.arch }} / ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        format: [dmg, zip]
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 30
    env:
      QA_VERSION: '0.1.0-test.20261119.1'
      QA_ARCH: ${{ inputs.arch }}
      QA_FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Confirm the native runner and exact candidate build archive
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUNNER_ARCH: ${{ inputs.arch == 'arm64' && 'ARM64' || 'X64' }}
          QA_BUILD: ${{ inputs.build_run }}
          QA_SOURCE_SHA: bee9aaee0db28bf05061b3f7461842b6d85b1fb0
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == "$QA_RUNNER_ARCH" ]]
          [[ "$(node -p 'process.arch')" == "$QA_ARCH" ]]
          [[ "$QA_BUILD" =~ ^[1-9][0-9]*$ ]]
          source="$RUNNER_TEMP/agentrans-mac-source"
          mkdir "$source"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_BUILD" | jq -e \
            --arg run "$QA_BUILD" --arg sha "$QA_SOURCE_SHA" \
            --arg title "Package Agentrans · mac-$QA_ARCH · nightly · $QA_VERSION" \
            'select((.id | tostring) == $run and .workflow_id == 413465192
              and .path == ".github/workflows/agentrans-hosted-package.yml"
              and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"
              and .head_sha == $sha and .head_branch == "codex/macos-session-package-fix-20261119"
              and .repository.full_name == "TLBtianhu/Agentrans" and .head_repository.full_name == "TLBtianhu/Agentrans"
              and .display_title == $title)
              | {id, head_sha, display_title, html_url}' > "$source/build.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_BUILD/artifacts" | jq -e \
            --arg name "agentrans-mac-$QA_ARCH" \
            'select(.total_count == 1 and (.artifacts | length) == 1) | .artifacts[0]
              | select((.id | type) == "number" and .id > 0 and .name == $name and .expired == false
                and .size_in_bytes > 0 and (.digest // "" | test("^sha256:[0-9a-f]{64}$")))
              | {id, name, size_in_bytes, digest}' > "$source/artifact.json"
          printf 'artifact-id=%s\n' "$(jq -er .id "$source/artifact.json")" >> "$GITHUB_OUTPUT"
      - name: Download the verified candidate archive
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          path: ${{ runner.temp }}/agentrans-mac-inputs
          digest-mismatch: error
      - name: Verify clean installation and session persistence
        shell: bash
        timeout-minutes: 16
        run: |
          input="$RUNNER_TEMP/agentrans-mac-inputs"
          node scripts/verify-macos.mjs "$input" "$RUNNER_TEMP/agentrans-mac-launch-report" "$QA_ARCH" "$QA_FORMAT" "$QA_VERSION"
      - name: Retain the verification report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-5-clean-${{ inputs.arch }}-${{ matrix.format }}-qa
          path: |
            ${{ runner.temp }}/agentrans-mac-source/*.json
            ${{ runner.temp }}/agentrans-mac-launch-report/result.json
          if-no-files-found: warn
          retention-days: 14
