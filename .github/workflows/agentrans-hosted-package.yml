name: Verify retained macOS updates with the existing Ed25519 key
run-name: Verify macOS Ed25519 · ${{ inputs.target }} · .4 to .5

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native architecture to verify
        type: choice
        options: [both, arm64, x64]
        default: both
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/ed25519-macos-update-20261119' && github.repository == 'TLBtianhu/Agentrans'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.target == 'both' && '["arm64","x64"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 30
    env:
      QA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Set private runner input and report paths
        shell: bash
        run: |
          {
            printf 'QA_OLD_ZIP=%s\n' "$RUNNER_TEMP/baseline-ed25519-input/agentrans-0.1.0-test.20261118.4-mac-$QA_ARCH-unsigned.zip"
            printf 'QA_NEW_ZIP=%s\n' "$RUNNER_TEMP/candidate-ed25519-input/agentrans-0.1.0-test.20261118.5-mac-$QA_ARCH-unsigned.zip"
            printf 'QA_REPORT_DIR=%s\n' "$RUNNER_TEMP/macos-ed25519-report/verification"
          } >> "$GITHUB_ENV"
      - name: Select the verified baseline and candidate Actions artifacts
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/macos-ed25519-update-inputs.mjs select
      - name: Download the original .4 test packages
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.packages.outputs.old_run }}
          artifact-ids: ${{ steps.packages.outputs.old_artifact }}
          path: ${{ runner.temp }}/baseline-ed25519-input
          digest-mismatch: error
      - name: Download the original .5 test packages
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.packages.outputs.new_run }}
          artifact-ids: ${{ steps.packages.outputs.new_artifact }}
          path: ${{ runner.temp }}/candidate-ed25519-input
          digest-mismatch: error
      - name: Sign the original candidate ZIP for this isolated run
        env:
          AGENTRANS_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRANS_UPDATE_SIGNING_KEY }}
        run: node scripts/macos-ed25519-update-inputs.mjs sign
      - name: Verify genuine and altered updates with the installed .4 app
        timeout-minutes: 20
        run: bash scripts/run-macos-ed25519-qa.sh
      - name: Retain the isolated QA report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-ed25519-qa-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-ed25519-report/**/*.json
          if-no-files-found: warn
          retention-days: 14
