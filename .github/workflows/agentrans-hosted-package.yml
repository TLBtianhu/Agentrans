name: Package Agentrans · hosted
run-name: Verify macOS native update · ${{ inputs.target }} · ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the macOS successor
        type: string
        required: true
      channel:
        description: Channel of the macOS successor
        type: choice
        options: [nightly, latest]
        required: true
      target:
        description: Build target family
        type: choice
        options: [mac, mac-arm64, mac-x64]
        required: true
      build_arm64_run_id:
        description: Successful macOS arm64 package run
        type: string
        required: true
      build_x64_run_id:
        description: Successful macOS x64 package run
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  macos-upgrade:
    if: github.repository == 'TLBtianhu/Agentrans' && github.ref == 'refs/heads/codex/macos-20261120-qa'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.target == 'mac' && '["arm64","x64"]' || inputs.target == 'mac-arm64' && '["arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 35
    env:
      AGENTRANS_TELEMETRY_DISABLED: '1'
      QA_ARCH: ${{ matrix.arch }}
      QA_BUILD_RUN: ${{ matrix.arch == 'arm64' && '44587762172' || '44587768747' }}
      QA_BUILD_COMMIT: '3c6b00d9827fe49f4766fb6b4ce0139a554f0c72'
      QA_OLD_VERSION: '0.1.0-test.20261119.1'
      QA_NEW_VERSION: '0.1.0-test.20261120.1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Set the runner report directory
        shell: bash
        run: printf 'QA_REPORT_DIR=%s\n' "$RUNNER_TEMP/macos-candidate-report/verification" >> "$GITHUB_ENV"
      - name: Verify the exact successful package run
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ matrix.arch == 'arm64' && inputs.build_arm64_run_id || inputs.build_x64_run_id }}
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_CHANNEL: ${{ inputs.channel }}
          PACKAGE_TARGET: ${{ inputs.target }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFile } from 'node:fs/promises'

          const env = process.env
          const repository = 'TLBtianhu/Agentrans'
          const target = `mac-${env.QA_ARCH}`
          assert.equal(process.platform, 'darwin')
          assert.equal(process.arch, env.QA_ARCH, 'Use a native runner matching the packaged architecture')
          assert.equal(env.RUNNER_ENVIRONMENT, 'github-hosted')
          assert.equal(env.PACKAGE_VERSION, env.QA_NEW_VERSION)
          assert.equal(env.PACKAGE_CHANNEL, 'nightly')
          assert.ok(env.PACKAGE_TARGET === 'mac' || env.PACKAGE_TARGET === target)
          assert.equal(env.PACKAGE_RUN_ID, env.QA_BUILD_RUN, 'Expected the authorized architecture-specific build run')
          assert.ok(env.GH_TOKEN, 'An Actions-read token is required')
          async function github(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              headers: {
                Accept: 'application/vnd.github+json', Authorization: `Bearer ${env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28',
              },
              redirect: 'error',
            })
            assert.ok(response.ok, `Package metadata request returned HTTP ${response.status}`)
            return response.json()
          }
          const name = `agentrans-${target}`
          const runId = Number(env.QA_BUILD_RUN)
          const [run, list] = await Promise.all([
            github(`actions/runs/${runId}`), github(`actions/runs/${runId}/artifacts?name=${name}`),
          ])
          assert.equal(run.id, runId)
          assert.equal(run.workflow_id, 413465192)
          assert.equal(run.path, '.github/workflows/agentrans-hosted-package.yml')
          assert.equal(run.repository?.full_name, repository)
          assert.equal(run.head_repository?.full_name, repository)
          assert.equal(run.head_sha, env.QA_BUILD_COMMIT)
          assert.equal(run.event, 'workflow_dispatch')
          assert.equal(run.status, 'completed')
          assert.equal(run.conclusion, 'success')
          assert.equal(run.display_title, `Package Agentrans · ${target} · nightly · ${env.QA_NEW_VERSION}`)
          assert.equal(list.total_count, 1, `Expected one ${name} artifact`)
          const [artifact] = list.artifacts
          assert.equal(artifact.name, name)
          assert.equal(artifact.expired, false)
          assert.equal(artifact.workflow_run.id, runId)
          assert.ok(Number.isSafeInteger(artifact.id) && artifact.id > 0)
          assert.ok(Number.isSafeInteger(artifact.size_in_bytes) && artifact.size_in_bytes > 0)
          assert.match(artifact.digest, /^sha256:[0-9a-f]{64}$/u)
          await appendFile(env.GITHUB_OUTPUT,
            `artifact_id=${artifact.id}\nartifact_bytes=${artifact.size_in_bytes}\nartifact_sha256=${artifact.digest}\n`)
          JS
      - name: Download the verified candidate archive
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.QA_BUILD_RUN }}
          artifact-ids: ${{ steps.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/macos-candidate-input/new
          digest-mismatch: error
      - name: Stage the original public DMG and verify package inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_ID: ${{ steps.package.outputs.artifact_id }}
          BUILD_ARTIFACT_BYTES: ${{ steps.package.outputs.artifact_bytes }}
          BUILD_ARTIFACT_SHA256: ${{ steps.package.outputs.artifact_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { createReadStream } from 'node:fs'
          import { appendFile, lstat, mkdir, readFile, writeFile } from 'node:fs/promises'
          import { basename, dirname, join } from 'node:path'
          import { publicKeyFromBase64, sha256File, verifyFileDigest } from './apps/desktop/src/update-signature.ts'
          import { UPDATE_SIGNING_PUBLIC_KEY } from './apps/desktop/src/update-signing-key.ts'

          const env = process.env
          const repo = 'TLBtianhu/Agentrans'
          const arch = env.QA_ARCH
          const tag = `v${env.QA_OLD_VERSION}`
          const oldName = `agentrans-${env.QA_OLD_VERSION}-mac-${arch}-unsigned.dmg`
          const oldImages = {
            arm64: [
              [oldName, 767596598, 273275335, 'c1eefcb48f2488ac19f4749d77d186a4e573927a29424e30eb1c6df781819d94'],
              [`${oldName}.sig`, 767600271, 88, 'aa33a6897639e45d883687a386f416fecc4b5b7a8f84fbd25e8378ad3cbbc194'],
            ],
            x64: [
              [oldName, 767598081, 292847072, '332914610f6573728c631b13ef1b3cd064b4f58425733614412528644fad2fd2'],
              [`${oldName}.sig`, 767600345, 88, '577c7847c51dcd878ee7e422896118a4b75d6976f594d09ef9e1ae83cfc7b331'],
            ],
          }
          const oldAssets = [
            ...oldImages[arch],
            ['test-mac.yml', 767600248, 604, 'd77c1e1f41e38e3701c488031ad4f2aee1c339ea47ac3eb06030c4077bbe9cee'],
            ['test-mac.yml.sig', 767600602, 88, 'c7db6477dcd6b789c34063031aa2780c1e8aa15694f9df2c29551076ee0f3c0f'],
          ]
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, {
            headers: {
              Accept: 'application/vnd.github+json', Authorization: `Bearer ${env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28',
            },
            redirect: 'error',
          })
          assert.ok(response.ok, `Public Release metadata request returned HTTP ${response.status}`)
          const release = await response.json()
          assert.equal(release.id, 451310439)
          assert.equal(release.tag_name, tag)
          assert.equal(release.target_commitish, 'bee9aaee0db28bf05061b3f7461842b6d85b1fb0')
          assert.equal(release.draft, false)
          assert.equal(release.prerelease, true)

          const root = join(env.RUNNER_TEMP, 'macos-candidate-input')
          const oldDir = join(root, 'old')
          const candidateDir = join(root, 'new')
          await mkdir(oldDir)
          for (const [name, id, size, sha256] of oldAssets) {
            const assets = release.assets.filter(asset => asset.name === name)
            assert.equal(assets.length, 1, `Expected one published ${name}`)
            const [asset] = assets
            const url = `https://github.com/${repo}/releases/download/${tag}/${name}`
            assert.equal(asset.id, id)
            assert.equal(asset.state, 'uploaded')
            assert.equal(asset.size, size)
            assert.equal(asset.digest, `sha256:${sha256}`)
            assert.equal(asset.browser_download_url, url)
            const file = join(oldDir, name)
            execFileSync('/usr/bin/curl', [
              '--fail', '--silent', '--show-error', '--location', '--retry', '3', '--connect-timeout', '20', '--max-time', '400',
              '--output', file, url,
            ], { stdio: 'inherit' })
            assert.equal((await lstat(file)).size, size, name)
            assert.equal(await sha256File(file), sha256, name)
          }
          const oldDmg = join(oldDir, oldName)
          const oldIndex = join(oldDir, 'test-mac.yml')
          const publicKey = publicKeyFromBase64(UPDATE_SIGNING_PUBLIC_KEY)
          const fingerprint = createHash('sha256').update(publicKey.export({ format: 'der', type: 'spki' })).digest('hex')
          assert.equal(fingerprint, '098885a5447f876f616ecd3cbdb156737cc6f4c00601958b1c78088842a81753')
          for (const file of [oldDmg, oldIndex]) {
            assert.ok(await verifyFileDigest(file, await readFile(`${file}.sig`, 'utf8'), publicKey),
              `Published ${basename(file)} failed its Ed25519 signature`)
          }

          const candidateStem = `agentrans-${env.QA_NEW_VERSION}-mac-${arch}-unsigned`
          const candidateDmg = join(candidateDir, `${candidateStem}.dmg`)
          const candidateZip = join(candidateDir, `${candidateStem}.zip`)
          const candidateMap = `${candidateZip}.blockmap`
          const candidateIndex = join(candidateDir, 'test-mac.yml')
          const candidateFiles = [candidateDmg, candidateZip, candidateMap, candidateIndex]
          const manifests = await Promise.all(candidateFiles.map(async file => {
            const stat = await lstat(file)
            assert.ok(stat.isFile() && stat.size > 0, `Candidate is missing the original ${basename(file)}`)
            return { name: basename(file), size: stat.size, sha256: await sha256File(file) }
          }))
          const [dmg, zip, blockmap, index] = manifests
          const hash = createHash('sha512')
          for await (const chunk of createReadStream(candidateZip)) hash.update(chunk)
          const zipSha512 = hash.digest('base64')
          const lines = (await readFile(candidateIndex, 'utf8')).split(/\r?\n/u)
          assert.ok(lines.includes(`version: ${env.QA_NEW_VERSION}`), 'Index version does not match the selected candidate')
          assert.ok(lines.includes(`  - url: ${zip.name}`), 'Index does not name the architecture-specific ZIP')
          assert.ok(lines.includes(`    sha512: ${zipSha512}`), 'Index does not match the original candidate ZIP digest')
          assert.ok(lines.includes(`    size: ${zip.size}`), 'Index does not match the original candidate ZIP size')
          await appendFile(env.GITHUB_ENV, [
            `QA_OLD_DMG=${oldDmg}`, `QA_NEW_ZIP=${candidateZip}`, `QA_NEW_METADATA=${candidateIndex}`,
            `QA_NEW_METADATA_SIG=${candidateIndex}.sig`, `QA_EXPECTED_NEW_SHA256=${zip.sha256}`,
            `QA_EXPECTED_OLD_SHA256=${oldAssets[0][3]}`, '',
          ].join('\n'))
          const reportDir = dirname(env.QA_REPORT_DIR)
          await mkdir(reportDir, { recursive: true })
          const report = {
            architecture: arch, baselineReleaseId: release.id, baselineTag: tag, baselineBuildCommit: release.target_commitish,
            baselineAssets: oldAssets.map(([name, id, size, sha256]) => ({ name, id, size, sha256 })),
            baselineSignatureVerified: true, candidateVersion: env.QA_NEW_VERSION, candidateBuildCommit: env.QA_BUILD_COMMIT,
            candidateBuildRun: Number(env.QA_BUILD_RUN), candidateArtifactId: Number(env.BUILD_ARTIFACT_ID),
            candidateArchiveBytes: Number(env.BUILD_ARTIFACT_BYTES), candidateArchiveSha256: env.BUILD_ARTIFACT_SHA256,
            candidateDmg: dmg, candidateZip: { ...zip, sha512: zipSha512 }, candidateBlockmap: blockmap, candidateIndex: index,
            publicKeySha256: fingerprint,
          }
          await writeFile(join(reportDir, 'inputs.json'), `${JSON.stringify(report, null, 2)}\n`, { flag: 'wx' })
          console.log(`Verified the published ${arch} installer and pinned the original candidate ZIP ${zip.sha256}`)
          JS
      - name: Sign the original candidate ZIP and update index for the isolated feed
        id: sign
        shell: bash
        env:
          AGENTRANS_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRANS_UPDATE_SIGNING_KEY }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createPublicKey } from 'node:crypto'
          import { readFile, writeFile } from 'node:fs/promises'
          import { dirname, join } from 'node:path'
          import { privateKeyFromBase64, publicKeyFromBase64, sha256File, signFileDigest, verifyFileDigest } from './apps/desktop/src/update-signature.ts'
          import { UPDATE_SIGNING_PUBLIC_KEY } from './apps/desktop/src/update-signing-key.ts'

          const env = process.env
          assert.ok(env.AGENTRANS_UPDATE_SIGNING_KEY, 'The existing update signing key is required')
          const key = privateKeyFromBase64(env.AGENTRANS_UPDATE_SIGNING_KEY)
          const pinned = publicKeyFromBase64(UPDATE_SIGNING_PUBLIC_KEY)
          assert.ok(key.asymmetricKeyType === 'ed25519' && createPublicKey(key).equals(pinned),
            'Signing key does not match the shipped public key')
          const inputs = JSON.parse(await readFile(join(dirname(env.QA_REPORT_DIR), 'inputs.json'), 'utf8'))
          for (const [file, expected] of [[env.QA_NEW_ZIP, inputs.candidateZip], [env.QA_NEW_METADATA, inputs.candidateIndex]]) {
            assert.equal(await sha256File(file), expected.sha256, 'Candidate bytes changed after input verification')
            const signature = await signFileDigest(file, key)
            assert.ok(await verifyFileDigest(file, signature, pinned), 'Candidate signature failed self-verification')
            await writeFile(`${file}.sig`, signature, { flag: 'wx' })
          }
          console.log(`Verified the isolated ${env.QA_ARCH} ZIP and index signatures against the shipped Ed25519 key`)
          JS
      - name: Verify genuine native installation, restart, and session reopening
        shell: bash
        timeout-minutes: 20
        run: bash apps/desktop/tests/fixtures/run-mac-candidate.sh
      - name: Retain the input and native-upgrade reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-native-upgrade-qa-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/macos-candidate-report/inputs.json
            ${{ runner.temp }}/macos-candidate-report/verification/**/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the candidate update signatures for this Actions build
        if: always() && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-candidate-update-signatures-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/macos-candidate-input/new/agentrans-0.1.0-test.20261120.1-mac-${{ matrix.arch }}-unsigned.zip.sig
            ${{ runner.temp }}/macos-candidate-input/new/test-mac.yml.sig
          if-no-files-found: error
          retention-days: 14
