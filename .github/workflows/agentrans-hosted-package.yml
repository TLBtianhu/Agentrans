name: Package Agentrans · hosted
run-name: Verify Windows differential update · ${{ inputs.version }} · build ${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the Windows successor'
        type: string
        required: true
      channel:
        description: 'Channel of the Windows successor'
        type: choice
        options: [nightly, latest]
        required: true
      target:
        description: 'Target of the Windows successor'
        type: choice
        options: [all, win-x64, mac-arm64, mac-x64, mac]
        required: true
      build_run_id:
        description: 'Successful GitHub Actions packaging run for this candidate'
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  windows-upgrade:
    if: github.repository == 'TLBtianhu/Agentrans'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AGENTRANS_TELEMETRY_DISABLED: '1'
      AGENTRANS_DESKTOP_UPDATE_CHECK_INTERVAL_MS: '3600000'
      QA_BUILD_COMMIT: '3c6b00d9827fe49f4766fb6b4ce0139a554f0c72'
      QA_OLD_VERSION: '0.1.0-test.20261119.1'
      QA_NEW_VERSION: '0.1.0-test.20261120.1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Verify the exact successful Windows package run
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.build_run_id }}
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_CHANNEL: ${{ inputs.channel }}
          PACKAGE_TARGET: ${{ inputs.target }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:PACKAGE_VERSION -cne $env:QA_NEW_VERSION -or $env:PACKAGE_CHANNEL -cne 'nightly' -or
              $env:PACKAGE_TARGET -cne 'win-x64' -or $env:PACKAGE_RUN_ID -cnotmatch '^[1-9][0-9]{5,15}$') {
            throw 'Expected the selected Windows x64 nightly candidate and a packaging run ID'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN_ID" | ConvertFrom-Json
          $title = "Package Agentrans · win-x64 · nightly · $env:QA_NEW_VERSION"
          if ([string]$run.id -cne $env:PACKAGE_RUN_ID -or $run.status -cne 'completed' -or
              $run.conclusion -cne 'success' -or $run.head_sha -cne $env:QA_BUILD_COMMIT -or
              $run.event -cne 'workflow_dispatch' -or $run.display_title -cne $title -or
              $run.path -cne '.github/workflows/agentrans-hosted-package.yml' -or
              $run.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY) {
            throw 'The packaging run does not match the authorized build'
          }
          $inventory = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          $artifacts = @($inventory.artifacts | Where-Object { $_.name -ceq 'agentrans-win-x64' })
          if ($artifacts.Count -ne 1 -or $artifacts[0].expired -or $artifacts[0].size_in_bytes -le 0 -or
              [string]$artifacts[0].id -cnotmatch '^[1-9][0-9]+$' -or $artifacts[0].digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
            throw 'The verified package run lacks one live Windows x64 artifact with an archive SHA-256'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @(
            "artifact_id=$($artifacts[0].id)", "artifact_bytes=$($artifacts[0].size_in_bytes)", "artifact_sha256=$($artifacts[0].digest)"
          )
      - name: Download the verified candidate archive
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/agentrans-upgrade-inputs/new
          digest-mismatch: error
      - name: Prepare the public baseline and pin installer inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          BUILD_ARTIFACT_BYTES: ${{ steps.candidate.outputs.artifact_bytes }}
          BUILD_ARTIFACT_SHA256: ${{ steps.candidate.outputs.artifact_sha256 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'agentrans-upgrade-inputs'
          $oldDir = Join-Path $root 'old'
          $newDir = Join-Path $root 'new'
          New-Item -Path $oldDir -ItemType Directory | Out-Null

          $tag = "v$env:QA_OLD_VERSION"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($release.id -ne 451310439 -or $release.tag_name -cne $tag -or $release.draft -or -not $release.prerelease) {
            throw 'The public baseline Release does not match its known identity'
          }
          $oldName = "agentrans-$env:QA_OLD_VERSION-win-x64-unsigned.exe"
          $expectedAssets = @(
            @{ Name=$oldName; Id=767599632; Size=290869954; SHA256='802bd688f4c77a72ff524a0cc0b96a2144264483ba521450c44b3f0a8b83f33b' },
            @{ Name="$oldName.blockmap"; Id=767600161; Size=303391; SHA256='8cd74e96a561cf6c4baf57fa4fde8263393f1b093c536ddf2ac5ae1d8dba4d39' },
            @{ Name="$oldName.blockmap.sig"; Id=767600552; Size=88; SHA256='bf3c2b9601fec050dd71c6788ce361c785d053f1b85ca27bc4b464fbee785b89' },
            @{ Name="$oldName.sig"; Id=767600505; Size=88; SHA256='593bb5d22e9d5dbf8e21aa1773fb88ef2a8418c435d47e393c7ee303d30a39a4' },
            @{ Name='test.yml'; Id=767600192; Size=417; SHA256='d02c9a05f44cc02c015b61f38fdfc359e9614097b5482888c59a31f275d40ed0' },
            @{ Name='test.yml.sig'; Id=767600589; Size=88; SHA256='b3f1508120787b9fb9a7cb1d482c9097e832184ddefec0e755e0c58729c6a280' }
          )
          foreach ($expected in $expectedAssets) {
            $asset = @($release.assets | Where-Object { $_.name -ceq $expected.Name })
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($expected.Name)"
            if ($asset.Count -ne 1 -or $asset[0].id -ne $expected.Id -or $asset[0].state -cne 'uploaded' -or
                $asset[0].size -ne $expected.Size -or $asset[0].digest -cne "sha256:$($expected.SHA256)" -or
                $asset[0].browser_download_url -cne $url) {
              throw "The public baseline asset inventory changed for $($expected.Name)"
            }
            $path = Join-Path $oldDir $expected.Name
            curl.exe --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 400 --output $path $url
            if ((Get-Item -LiteralPath $path).Length -ne $expected.Size -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $expected.SHA256) {
              throw "Downloaded public baseline bytes differ for $($expected.Name)"
            }
          }

          $old = Join-Path $oldDir $oldName
          $new = Join-Path $newDir "agentrans-$env:QA_NEW_VERSION-win-x64-unsigned.exe"
          $newIndex = Join-Path $newDir 'test.yml'
          foreach ($path in @($new, "$new.blockmap", $newIndex)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "The candidate archive is missing $(Split-Path -Leaf $path)"
            }
          }
          $newHash = (Get-FileHash -LiteralPath $new -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value @(
            "QA_OLD_EXE=$old", "QA_NEW_EXE=$new", "QA_INPUTS_ROOT=$root", "QA_NEW_SHA256=$newHash"
          )
          $proof = [ordered]@{
            baselineReleaseId = $release.id
            baselineTag = $tag
            baselineAssets = $expectedAssets
            candidateVersion = $env:QA_NEW_VERSION
            candidateBuildCommit = $env:QA_BUILD_COMMIT
            candidateBuildRun = $env:BUILD_RUN_ID
            candidateArtifactId = $env:BUILD_ARTIFACT_ID
            candidateArtifactBytes = [long]$env:BUILD_ARTIFACT_BYTES
            candidateArchiveSha256 = $env:BUILD_ARTIFACT_SHA256
            candidateInstallerBytes = (Get-Item -LiteralPath $new).Length
            candidateInstallerSha256 = $newHash
            candidateIndexSha256 = (Get-FileHash -LiteralPath $newIndex -Algorithm SHA256).Hash.ToLowerInvariant()
            candidateBlockmapSha256 = (Get-FileHash -LiteralPath "$new.blockmap" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $proof | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-candidate-inputs.json') -Encoding utf8NoBOM
          "Verified Windows candidate SHA-256 $newHash"
      - name: Verify the baseline and sign candidate update assets for the isolated feed
        id: sign
        shell: pwsh
        env:
          AGENTRANS_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRANS_UPDATE_SIGNING_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $source = @'
          import assert from 'node:assert/strict'
          import { createHash, createPublicKey } from 'node:crypto'
          import { readFile, writeFile } from 'node:fs/promises'
          import { dirname, join } from 'node:path'
          import { publicKeyFromBase64, privateKeyFromBase64, sha256File, signFileDigest, verifyFileDigest } from './apps/desktop/src/update-signature.ts'
          import { UPDATE_SIGNING_PUBLIC_KEY } from './apps/desktop/src/update-signing-key.ts'

          const encodedKey = process.env.AGENTRANS_UPDATE_SIGNING_KEY
          assert.ok(encodedKey, 'Expected the repository update-signing key')
          const privateKey = privateKeyFromBase64(encodedKey)
          const publicKey = publicKeyFromBase64(UPDATE_SIGNING_PUBLIC_KEY)
          const fingerprint = createHash('sha256').update(publicKey.export({ format: 'der', type: 'spki' })).digest('hex')
          assert.equal(fingerprint, '098885a5447f876f616ecd3cbdb156737cc6f4c00601958b1c78088842a81753', 'Candidate must retain the published updater verification key')
          assert.ok(createPublicKey(privateKey).equals(publicKey), 'The repository signer must match the installed updater key')
          const old = process.env.QA_OLD_EXE
          const next = process.env.QA_NEW_EXE
          assert.equal(await sha256File(next), process.env.QA_NEW_SHA256, 'Candidate installer changed after archive validation')
          for (const path of [old, old + '.blockmap', join(dirname(old), 'test.yml')]) {
            assert.ok(await verifyFileDigest(path, await readFile(path + '.sig', 'utf8'), publicKey),
              'A public baseline asset failed Ed25519 verification')
          }
          for (const path of [next, join(dirname(next), 'test.yml')]) {
            const signature = await signFileDigest(path, privateKey)
            assert.ok(await verifyFileDigest(path, signature, publicKey), 'An isolated-feed asset failed Ed25519 verification')
            await writeFile(path + '.sig', signature, { flag: 'wx' })
          }
          console.log('Verified the public baseline signatures and two isolated-feed candidate signatures')
          '@
          $source | node --input-type=module
      - name: Verify the true installed update using the isolated feed
        shell: pwsh
        timeout-minutes: 16
        run: pwsh -NoLogo -NoProfile -NonInteractive -File apps/desktop/tests/fixtures/run-win-candidate.ps1
      - name: Retain the input and installed upgrade reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-cross-version-upgrade-qa
          path: |
            ${{ runner.temp }}/windows-candidate-inputs.json
            ${{ runner.temp }}/agentrans-upgrade-qa/result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the candidate update signatures for this Actions build
        if: always() && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-candidate-update-signatures
          path: |
            ${{ runner.temp }}/agentrans-upgrade-inputs/new/agentrans-0.1.0-test.20261120.1-win-x64-unsigned.exe.sig
            ${{ runner.temp }}/agentrans-upgrade-inputs/new/test.yml.sig
          if-no-files-found: error
          retention-days: 14
