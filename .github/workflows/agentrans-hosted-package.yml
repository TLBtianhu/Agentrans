name: Package Agentrans · hosted
run-name: Verify ordinary macOS candidate .4 first launch

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact successor version to verify
        type: string
        required: true
      channel:
        description: Installed update channel
        type: choice
        options: [nightly, latest]
        required: true
      target:
        description: Packaging target that produced the artifact
        type: choice
        options: [all, win-x64, mac-arm64, mac-x64, mac]
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify macOS ${{ matrix.arch }} / ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            format: dmg
            runner: macos-latest
            runner_arch: ARM64
          - arch: arm64
            format: zip
            runner: macos-latest
            runner_arch: ARM64
          - arch: x64
            format: dmg
            runner: macos-26-intel
            runner_arch: X64
          - arch: x64
            format: zip
            runner: macos-26-intel
            runner_arch: X64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        if: matrix.arch == 'arm64' && matrix.format == 'dmg'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Download the exact macOS startup candidate
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_VERSION: ${{ inputs.version }}
          QA_CHANNEL: ${{ inputs.channel }}
          QA_TARGET: ${{ inputs.target }}
          QA_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' && "$RUNNER_OS" == 'macOS' ]]
          [[ "$RUNNER_ARCH" == "$QA_RUNNER_ARCH" && "$GITHUB_REPOSITORY" == 'TLBtianhu/Agentrans' ]]
          [[ "$QA_VERSION" == '0.1.0-test.20261118.4' && "$QA_CHANNEL" == 'nightly' && "$QA_TARGET" == 'mac' ]]
          build=44480323500
          candidate_sha=aa52b730df40252cbe1675039f1043698148beee
          [[ "$build" =~ ^[0-9]+$ && "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          input_dir="$RUNNER_TEMP/agentrans-mac-inputs"
          source_dir="$RUNNER_TEMP/agentrans-mac-source"
          mkdir "$input_dir" "$source_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build" | jq -e \
            --arg sha "$candidate_sha" --arg title "Package Agentrans · mac · nightly · $QA_VERSION" \
            'select(.conclusion == "success" and .head_sha == $sha and .display_title == $title)
              | {id, head_sha, display_title, conclusion, html_url}' > "$source_dir/mac.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build/artifacts?per_page=20" \
            | jq -e '[.artifacts[] | select(.name == "agentrans-mac" and .expired == false)]
                | select(length == 1) | .[0] | {id, name, size_in_bytes, digest}' > "$source_dir/artifact.json"
          gh run download "$build" --repo "$GITHUB_REPOSITORY" --name agentrans-mac --dir "$input_dir"
      - name: Install locked metadata-validation dependencies
        if: matrix.arch == 'arm64' && matrix.format == 'dmg'
        run: pnpm install --frozen-lockfile
      - name: Verify update metadata and both ZIP blockmaps
        if: matrix.arch == 'arm64' && matrix.format == 'dmg'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/agentrans-mac-metadata"
          node scripts/verify-metadata.mjs "$RUNNER_TEMP/agentrans-mac-inputs" 0.1.0-test.20261118.4 \
            "$RUNNER_TEMP/agentrans-mac-metadata/metadata.json"
      - name: Verify the normal first launch from this artifact
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        timeout-minutes: 12
        shell: bash
        env:
          QA_ARCH: ${{ matrix.arch }}
          QA_FORMAT: ${{ matrix.format }}
        run: |
          node scripts/verify-macos.mjs "$RUNNER_TEMP/agentrans-mac-inputs" \
            "$RUNNER_TEMP/agentrans-mac-launch-report" "$QA_ARCH" "$QA_FORMAT" 0.1.0-test.20261118.4
      - name: Retain the verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-candidate-${{ matrix.arch }}-${{ matrix.format }}-qa
          path: |
            ${{ runner.temp }}/agentrans-mac-source/*.json
            ${{ runner.temp }}/agentrans-mac-metadata/metadata.json
            ${{ runner.temp }}/agentrans-mac-launch-report/result.json
          if-no-files-found: warn
