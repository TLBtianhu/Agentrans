name: Package Agentrans · hosted
run-name: Check Agentrans macOS signing prerequisites

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact successor version to verify
        type: string
        required: true
      channel:
        description: Installed update channel
        type: choice
        options: [nightly, latest]
        required: true
      target:
        description: Packaging target that produced the artifact
        type: choice
        options: [all, win-x64, mac-arm64, mac-x64, mac]
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Check macOS ${{ matrix.arch }} toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            runner_arch: ARM64
          - arch: x64
            runner: macos-26-intel
            runner_arch: X64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: 402a3b11a38a55e712d5bdc97df96365fb209b59
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check native tools and fail closed with missing signing settings
        shell: bash
        env:
          QA_ARCH: ${{ matrix.arch }}
          QA_RUNNER_ARCH: ${{ matrix.runner_arch }}
          QA_VERSION: ${{ inputs.version }}
          QA_CHANNEL: ${{ inputs.channel }}
          QA_TARGET: ${{ inputs.target }}
          AGENTRANS_PACKAGING_CONFIG_DIR: ${{ runner.temp }}/agentrans-signing-check-config
          AGENTRANS_PACKAGING_PRESET: test
          AGENTRANS_DESKTOP_UPDATE_CHANNEL: nightly
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == "$QA_RUNNER_ARCH" ]]
          [[ "$QA_VERSION" == '0.1.0-test.20261118.4' && "$QA_CHANNEL" == nightly && "$QA_TARGET" == mac ]]
          [[ "$(git rev-parse HEAD)" == 402a3b11a38a55e712d5bdc97df96365fb209b59 ]]
          umask 077
          report="$RUNNER_TEMP/agentrans-signing-check-output"
          mkdir "$report" "$AGENTRANS_PACKAGING_CONFIG_DIR"
          mkdir "$AGENTRANS_PACKAGING_CONFIG_DIR/presets" "$AGENTRANS_PACKAGING_CONFIG_DIR/secrets"
          printf '%s\n' AGENTRANS_DESKTOP_APP_ID=com.agentrans.app > "$AGENTRANS_PACKAGING_CONFIG_DIR/presets/test.env"
          signing="$AGENTRANS_PACKAGING_CONFIG_DIR/secrets/macos-signing.env"
          : > "$signing"
          {
            node --version
            xcodebuild -version
            for tool in codesign security ditto hdiutil; do command -v "$tool"; done
            xcrun --find notarytool
            xcrun --find stapler
          } | tee "$report/tools.txt"
          check=(pnpm --dir apps/desktop run check:package "mac-$QA_ARCH" --build-version "$QA_VERSION")
          "${check[@]}" --unsigned 2>&1 | tee "$report/unsigned.txt"
          expect_rejection() {
            local name="$1" message="$2"
            shift 2
            if "${check[@]}" "$@" > "$report/$name.txt" 2>&1; then
              echo "Missing signing settings were accepted in $name" >&2
              exit 1
            fi
            grep -F "$message" "$report/$name.txt"
          }
          expect_rejection missing-identity 'AGENTRANS_DESKTOP_MACOS_SIGNING_IDENTITY must be set'
          printf '%s\n' 'AGENTRANS_DESKTOP_MACOS_SIGNING_IDENTITY=Preflight Placeholder' \
            'AGENTRANS_DESKTOP_MACOS_TEAM_ID=TEST000001' > "$signing"
          expect_rejection missing-notary 'macOS packaging requires APPLE_API_KEY'
          expect_rejection missing-p12 'CSC_LINK must identify a readable local file' --skip-notarization
      - name: Retain the configuration-only reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-signing-check-${{ matrix.arch }}
          path: ${{ runner.temp }}/agentrans-signing-check-output/*.txt
          if-no-files-found: warn
