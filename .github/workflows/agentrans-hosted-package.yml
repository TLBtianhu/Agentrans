name: Package Agentrans · hosted
run-name: Diagnose macOS candidate .3 startup

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact successor version to verify
        type: string
        required: true
      channel:
        description: Installed update channel
        type: choice
        options: [nightly, latest]
        required: true
      target:
        description: Packaging target that produced the artifact
        type: choice
        options: [all, win-x64, mac-arm64, mac-x64, mac]
        required: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            runner_arch: ARM64
          - arch: x64
            runner: macos-26-intel
            runner_arch: X64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      AGENTRANS_TELEMETRY_DISABLED: '1'
      AGENTRANS_DESKTOP_UPDATE_CHECK_INTERVAL_MS: '3600000'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Download the exact candidate package artifact
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_VERSION: ${{ inputs.version }}
          QA_CHANNEL: ${{ inputs.channel }}
          QA_TARGET: ${{ inputs.target }}
          QA_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' && "$RUNNER_OS" == 'macOS' ]]
          [[ "$RUNNER_ARCH" == "$QA_RUNNER_ARCH" ]]
          [[ "$QA_VERSION" == '0.1.0-test.20261118.3' && "$QA_CHANNEL" == 'nightly' && "$QA_TARGET" == 'mac' ]]
          [[ "$GITHUB_REPOSITORY" == 'TLBtianhu/Agentrans' ]]
          mac_build=44471181090
          windows_build=44321192711
          candidate_sha=5e1154e1dcdb0d23f84fdb4d5e8f252dfcbf884b
          input_dir="$RUNNER_TEMP/agentrans-mac-inputs"
          source_dir="$RUNNER_TEMP/agentrans-mac-source"
          mkdir "$input_dir" "$source_dir"
          for build in "$mac_build" "$windows_build"; do
            if [[ "$build" == "$mac_build" ]]; then target=mac; else target=win-x64; fi
            title="Package Agentrans · $target · nightly · $QA_VERSION"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build" | jq -e \
              --arg sha "$candidate_sha" --arg title "$title" \
              'select(.conclusion == "success" and .head_sha == $sha and .display_title == $title)
                | {id, head_sha, display_title, conclusion, html_url}' > "$source_dir/$target.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$mac_build/artifacts?per_page=20" \
            | jq -e '[.artifacts[] | select(.name == "agentrans-mac" and .expired == false)]
                | select(length == 1) | .[0] | {id, name, size_in_bytes, digest}' > "$source_dir/artifact.json"
          gh run download "$mac_build" --repo "$GITHUB_REPOSITORY" --name agentrans-mac --dir "$input_dir"
      - name: Diagnose startup from the original candidate ZIP
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        timeout-minutes: 16
        shell: bash
        env:
          QA_ARCH: ${{ matrix.arch }}
          AGENTRANS_MAC_LAUNCH_DIAGNOSTICS: '1'
        run: |
          node scripts/verify-macos.mjs "$RUNNER_TEMP/agentrans-mac-inputs" \
            "$RUNNER_TEMP/agentrans-mac-launch-report" "$QA_ARCH"
      - name: Retain the verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-candidate-${{ matrix.arch }}-qa
          path: |
            ${{ runner.temp }}/agentrans-mac-source/*.json
            ${{ runner.temp }}/agentrans-mac-launch-report/result.json
          if-no-files-found: warn
