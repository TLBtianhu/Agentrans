name: Package Agentrans · hosted
run-name: Verify Windows installer test package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the retained Windows installer'
        type: string
        required: true
      channel:
        description: 'Channel of the retained Windows installer'
        type: choice
        options: [nightly, latest]
        required: true
      target:
        description: 'Target of the retained Windows installer'
        type: choice
        options: [all, win-x64, mac-arm64, mac-x64, mac]
        required: true

permissions:
  actions: read
  contents: read

jobs:
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      AGENTRANS_TELEMETRY_DISABLED: '1'
      AGENTRANS_DESKTOP_UPDATE_CHECK_INTERVAL_MS: '3600000'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Download and verify the retained installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_VERSION: ${{ inputs.version }}
          QA_CHANNEL: ${{ inputs.channel }}
          QA_TARGET: ${{ inputs.target }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:QA_VERSION -ne '0.1.0-test.20261118.1' -or $env:QA_CHANNEL -ne 'nightly' -or $env:QA_TARGET -ne 'win-x64') {
            throw 'This check accepts the exact retained Windows test package'
          }
          $run = gh api repos/TLBtianhu/Agentrans/actions/runs/44268972216 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne '91fd8f2eb17467438fe8dd3e1d088a38457fdd15') {
            throw 'Retained package source does not match its verified build'
          }
          $download = Join-Path $env:RUNNER_TEMP 'agentrans-existing-package'
          gh run download 44268972216 --repo TLBtianhu/Agentrans --name agentrans-win-x64 --dir $download
          $installer = Join-Path $download 'agentrans-0.1.0-test.20261118.1-win-x64-unsigned.exe'
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($sha -ne '89ecc5ce9d75f67bb691cba7ce15b69288f93fe4ca6934746cd732b14b8a164c') {
            throw 'Retained installer digest changed'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VERIFIED_INSTALLER=$installer"
          "Verified installer SHA-256 $sha"
      - name: Install and qualify in the disposable runner
        shell: pwsh
        run: node scripts/verify-existing-windows-install.mjs "$env:VERIFIED_INSTALLER" (Join-Path $env:RUNNER_TEMP 'agentrans-installed-qa')
      - name: Retain the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-existing-package-qa
          path: ${{ runner.temp }}/agentrans-installed-qa/result.json
          if-no-files-found: warn