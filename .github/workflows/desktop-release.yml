name: Publish Desktop release
run-name: Verify the signed Desktop draft

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: '打包运行 ID：该次运行产出的安装包、blockmap 与通道元数据将附加到 Release'
        required: true
        type: string
      version:
        description: '产物版本号：须与打包运行产出的文件名一致'
        required: true
        type: string
      channel:
        description: '更新通道：nightly 发布预发布，latest 发布正式 Release'
        required: true
        type: choice
        options: [nightly, latest]

permissions:
  contents: write
  actions: read

concurrency:
  group: agentrans-desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      PACKAGE_VERSION: ${{ inputs.version }}
      PACKAGE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the packaging run and stage its assets
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --import tsx apps/desktop/scripts/stage-hosted-desktop-release.ts "$PACKAGE_RUN_ID" "$PACKAGE_VERSION" "$PACKAGE_CHANNEL"
      - name: Sign and stage the Desktop draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTRANS_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRANS_UPDATE_SIGNING_KEY }}
          AGENTRANS_DESKTOP_PACKAGE_SHA: ${{ steps.package.outputs.source_sha }}
          AGENTRANS_DESKTOP_PACKAGE_TARGET: ${{ steps.package.outputs.package_target }}
          PACKAGE_ASSETS_DIR: ${{ steps.package.outputs.assets_dir }}
        run: node --import tsx apps/desktop/scripts/publish-github-release.ts "$PACKAGE_ASSETS_DIR" "$PACKAGE_VERSION" "$PACKAGE_CHANNEL" --draft-only
