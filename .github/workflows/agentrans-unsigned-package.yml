name: Package Agentrans · Windows · hosted

# Hosted-runner packaging for the unsigned Agentrans installer.
#
# The self-hosted lanes exist for signed release builds, which need a hardware
# token and a signing environment. This lane builds the same installer without a
# certificate so the packaging, publishing, and update chain can be exercised
# without that hardware. Its artifacts are unsigned: Windows warns on first
# install, and that warning is the certificate's problem, not this workflow's.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本，例如 0.2.2-alpha.3（须为合法 semver；latest 通道要求稳定版本）'
        type: string
        required: true
      channel:
        description: '更新通道：nightly 读取预发布，latest 读取正式版本'
        type: choice
        options: [nightly, latest]
        default: nightly
        required: true

permissions:
  contents: read

concurrency:
  group: agentrans-unsigned-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DSH_DESKTOP_UPDATE_CHANNEL: ${{ inputs.channel }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Packaging reads its settings from a git-ignored file, so the lane writes only the two
      # settings it needs rather than copying the template's stale release credentials.
      - name: Write the packaging settings this lane uses
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.agentrans.app
          DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3
          '@ | Set-Content -Path apps/desktop/.env.windows -Encoding utf8

      # The installer entry packages a prepared tree; this prepares it without producing an
      # installer of its own, which is the step the signed lanes get from their full package run.
      - name: Prepare the packaged runtime
        run: pnpm run package:desktop:win:x64 --unsigned --prepare-only --build-version ${{ inputs.version }}

      - name: Build the unsigned installer
        run: node apps/desktop/scripts/package-agentrans-installer.mjs artifacts/agentrans-installer

      - name: Publish the packaged files for this run
        uses: actions/upload-artifact@v4
        with:
          name: agentrans-windows-x64
          path: apps/desktop/artifacts/agentrans-installer/*
          if-no-files-found: error
          compression-level: 0
