name: Package Desktop · macOS · Apple Silicon

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '打包源码：test 支持仓库内分支或 dsh-v* tag；production 仅支持 main、master 或 dsh-v* tag；源码须包含 CI 适配脚本'
        type: string
        default: main
        required: true
      preset:
        description: '打包环境：选择机器上的 test 或 production 配置；同时决定后续发布环境'
        type: choice
        options: [test, production]
        default: test
        required: true
      update_channel:
        description: '升级通道：nightly 或 latest（须为稳定版本）；自动更新不会切换通道'
        type: choice
        options: [nightly, latest]
        default: nightly
        required: true
      version_mode:
        description: '版本模式：default 为 test 自动编号、production 跟随产品；product 保留原版本，auto 自动编号，manual 手填'
        type: choice
        options: [default, product, auto, manual]
        default: default
        required: true
      build_version:
        description: '手动版本号：仅 manual 时填写完整版本；须为产品原版本或受支持的预发布后缀'
        type: string
        default: ''
        required: false
      test_release_id:
        description: '测试 release ID：32 位小写十六进制随机前缀（非鉴权）；留空使用机器默认值，连续升级测试须保持相同值'
        type: string
        default: ''
        required: false
      compression_level:
        description: 'ZIP 压缩等级：只影响 ZIP 和自动升级下载，不影响 DMG；3 打包较快，7 压缩更强'
        type: choice
        options: ['3', '7']
        default: '3'
        required: true
      skip_notarization:
        description: '跳过公证和 stapling：仅限内部调试，禁止发布到 test / production 或用于自动更新；需要发布请勿勾选'
        type: boolean
        default: false
        required: true
      runner_mode:
        description: '执行方式：self-hosted 使用专用主机，hosted-check 只检查所选工作流提交，hosted-sign 正式签名并公证'
        type: choice
        options: [self-hosted, hosted-check, hosted-sign]
        default: self-hosted
        required: true
      source_sha:
        description: '托管任务预期的完整提交 SHA；hosted-sign 必填，须等于 main 上选定的工作流提交'
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.runner_mode == 'self-hosted' && 'macos-desktop-package' || 'macos-hosted-arm64' }}
  cancel-in-progress: false

jobs:
  package:
    if: inputs.runner_mode == 'self-hosted'
    runs-on: [self-hosted, macOS, ARM64, dsh-mac-package-trial]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      AGENTRANS_DESKTOP_TARGET_PLATFORM: darwin
      AGENTRANS_DESKTOP_TARGET_ARCH: arm64
      PACKAGE_MACOS_ZIP_COMPRESSION_LEVEL: ${{ inputs.compression_level }}
      PACKAGE_SKIP_NOTARIZATION: ${{ inputs.skip_notarization }}
      PACKAGE_SOURCE_REF: ${{ inputs.source_ref }}
      PACKAGE_VERSION_MODE: ${{ inputs.version_mode }}
      AGENTRANS_DESKTOP_UPDATE_CHANNEL: ${{ inputs.update_channel }}
      AGENTRANS_TELEMETRY_DISABLED: '1'
      AGENTRANS_PACKAGING_PRESET: ${{ inputs.preset }}
      PACKAGE_TEST_RELEASE_ID: ${{ inputs.test_release_id }}
    steps:
      - name: Checkout workflow helpers
        if: inputs.preset == 'production' && !inputs.skip_notarization
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: apps/desktop/scripts
      - name: Stage workflow helpers
        if: inputs.preset == 'production' && !inputs.skip_notarization
        run: |
          helpers=$(mktemp -d "$RUNNER_TEMP/packaging-helpers-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXX")
          cp apps/desktop/scripts/retain-signed-desktop-ci.mjs "$helpers/"
          echo "PACKAGE_CI_HELPERS=$helpers" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
          ref: ${{ inputs.source_ref }}
      - name: Validate selected source and adapter support
        run: >-
          node -e "const fs=require('node:fs'); const ref=process.env.PACKAGE_SOURCE_REF;
          const cp=require('node:child_process'); const preset=process.env.AGENTRANS_PACKAGING_PRESET;
          if(!['test','production'].includes(preset)) throw Error('Unknown packaging preset');
          const tag=/^dsh-v[0-9][0-9A-Za-z.-]*$/.test(ref);
          if(preset==='production' && !['main','master'].includes(ref) && !tag) throw Error('Production source must be main, master or dsh-v*');
          if(tag) {
          const v=JSON.parse(fs.readFileSync('package.json','utf8')).version;
          if(ref!=='dsh-v'+v) throw Error('Source tag must match product version');
          const tagged=cp.execFileSync('git',['rev-parse','--verify','refs/tags/'+ref+'^{commit}'],{encoding:'utf8'}).trim();
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(tagged!==head) throw Error('Checkout does not match source tag');
          } else {
          const branch=cp.execFileSync('git',['rev-parse','--abbrev-ref','HEAD'],{encoding:'utf8'}).trim();
          if(branch==='HEAD' || branch!==ref || ref.startsWith('refs/')) throw Error('Select a branch in this repository, not a SHA or PR ref');
          }
          if(!fs.readFileSync('apps/desktop/scripts/desktop-ci-version.mjs','utf8').includes('PACKAGE_VERSION_MODE')) throw Error('Source lacks Desktop channel/version CI support; select a newer release');"
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Configure persistent package caches
        env:
          AGENTRANS_DESKTOP_PACKAGE_CACHE_DIR: ${{ runner.tool_cache }}/dsh-desktop-package-cache
        run: |
          echo "AGENTRANS_DESKTOP_PACKAGE_CACHE_DIR=$AGENTRANS_DESKTOP_PACKAGE_CACHE_DIR" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$AGENTRANS_DESKTOP_PACKAGE_CACHE_DIR/workspace-pnpm-store" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate preset and resolve build version
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
        run: node apps/desktop/scripts/prepare-macos-ci.mjs
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          args=()
          if [[ "$PACKAGE_SKIP_NOTARIZATION" = true ]]; then args+=(--skip-notarization); fi
          pnpm run package:desktop:mac:arm64 --check --build-version "$PACKAGE_VERSION" "${args[@]}"
      - name: Build signed installers
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          args=()
          if [[ "$PACKAGE_SKIP_NOTARIZATION" = true ]]; then args+=(--skip-notarization); fi
          pnpm run package:desktop:mac:arm64 --build-version "$PACKAGE_VERSION" "${args[@]}"
      # Publication reads these files from the run's artifacts, not from the machine that built them.
      - name: Collect packaged artifacts outside the checkout
        if: inputs.preset != 'production' || inputs.skip_notarization
        id: retained
        run: node --import tsx apps/desktop/scripts/retain-desktop-ci.ts
      - name: Collect production installers and source record
        if: inputs.preset == 'production' && !inputs.skip_notarization
        id: retained_production
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: node "$PACKAGE_CI_HELPERS/retain-signed-desktop-ci.mjs" mac-arm64
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain installers for the selected mode
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-arm64-${{ steps.settings.outputs.mode }}-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ steps.retained_production.outputs.directory || steps.retained.outputs.directory }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  hosted:
    if: inputs.runner_mode == 'hosted-check' || inputs.runner_mode == 'hosted-sign'
    uses: ./.github/workflows/macos-hosted-package.yml
    with:
      arch: arm64
      runner_mode: ${{ inputs.runner_mode }}
      source_ref: ${{ inputs.source_ref }}
      source_sha: ${{ inputs.source_sha }}
      preset: ${{ inputs.preset }}
      update_channel: ${{ inputs.update_channel }}
      version_mode: ${{ inputs.version_mode }}
      build_version: ${{ inputs.build_version }}
      test_release_id: ${{ inputs.test_release_id }}
      compression_level: ${{ inputs.compression_level }}
      skip_notarization: ${{ inputs.skip_notarization }}

  hosted_sign:
    name: Sign and notarize macOS arm64 installers
    needs: hosted
    if: >-
      inputs.runner_mode == 'hosted-sign' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.source_ref == 'main' &&
      inputs.source_sha == github.sha &&
      inputs.preset == 'production' &&
      inputs.version_mode != 'auto' &&
      !inputs.skip_notarization &&
      inputs.test_release_id == ''
    runs-on: macos-26
    timeout-minutes: 180
    environment: macos-production-signing
    env:
      AGENTRANS_DESKTOP_TARGET_PLATFORM: darwin
      AGENTRANS_DESKTOP_TARGET_ARCH: arm64
      AGENTRANS_PACKAGING_PRESET: production
      AGENTRANS_DESKTOP_UPDATE_CHANNEL: ${{ inputs.update_channel }}
      AGENTRANS_TELEMETRY_DISABLED: '1'
      PACKAGE_MACOS_ZIP_COMPRESSION_LEVEL: ${{ inputs.compression_level }}
      PACKAGE_SKIP_NOTARIZATION: 'false'
      EXPECTED_RUNNER_ARCH: ARM64
      PACKAGE_SOURCE_REF: main
      PACKAGE_SOURCE_SHA: ${{ inputs.source_sha }}
      PACKAGE_VERSION_MODE: manual
      PACKAGE_BUILD_VERSION: ${{ needs.hosted.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm the authenticated source and native runner
        shell: bash
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" && "$GITHUB_SHA" == "$PACKAGE_SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare the public production settings
        id: config
        run: node apps/desktop/scripts/prepare-hosted-macos-ci.mjs public
      - name: Stage the temporary Apple signing credentials
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_NOTARIZATION_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARIZATION_KEY_P8_BASE64 }}
          MACOS_NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
          MACOS_NOTARIZATION_ISSUER_ID: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
          DESKTOP_MACOS_TEAM_ID: ${{ vars.DESKTOP_MACOS_TEAM_ID }}
          DESKTOP_MACOS_SIGNING_IDENTITY: ${{ vars.DESKTOP_MACOS_SIGNING_IDENTITY }}
        run: node apps/desktop/scripts/prepare-hosted-macos-ci.mjs credentials
      - name: Check signed package configuration and toolchain
        shell: bash
        run: |
          node apps/desktop/scripts/prepare-macos-ci.mjs
          pnpm run "package:desktop:mac:$AGENTRANS_DESKTOP_TARGET_ARCH" --check --build-version "$PACKAGE_VERSION"
      - name: Build and notarize signed macOS installers
        run: pnpm run "package:desktop:mac:$AGENTRANS_DESKTOP_TARGET_ARCH" --build-version "$PACKAGE_VERSION"
      - name: Collect installers and the signed build's source record
        id: retained
        run: node apps/desktop/scripts/retain-signed-desktop-ci.mjs "mac-$AGENTRANS_DESKTOP_TARGET_ARCH"
      - name: Remove the temporary signing configuration
        if: always() && steps.config.outcome == 'success'
        run: node apps/desktop/scripts/prepare-hosted-macos-ci.mjs cleanup
      - name: Retain the verified installers for this run
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-arm64-signed-${{ needs.hosted.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.retained.outputs.directory }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
